<!DOCTYPE html>
<html>

<head>
    <title>Cartoon Character Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fcffe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 300px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff9800;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }

        .btn:hover {
            background: #e68900;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="jerry.webp" alt="Cartoon Character">

        <div class="card-content">
            <h2>Jerry</h2>
            <p>
                Maincharecter from tom an jerry cartoon
            </p>

            <a href="#" class="btn">View Profile</a>
        </div>
    </div>

</body>

</html>
